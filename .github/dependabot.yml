version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "daily"
      # day: "monday"
      time: "19:00"
      timezone: "Europe/Athens"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "ci"

    commit-message:
      prefix: "ci"
      