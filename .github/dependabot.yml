version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:30"
      timezone: "Europe/Athens"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "ci"

    commit-message:
      prefix: "ci"
      